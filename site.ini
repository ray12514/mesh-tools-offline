[site]
# Example shared-filesystem paths. Set these for the target cluster.
install_root = /apps/mesh-tools
module_root = /apps/modulefiles
build_root = /scratch/mesh-builds
# Empty selects the installer's effective Unix group.
group =
# Choose a new tag for a different compiler version, flags or runtime stack.
build_tag = gcc-local
jobs = 4

# Empty uses CC and CXX from the loaded environment, then cc and c++.
# For Intel oneAPI, load the site's compiler module and set cc=icx, cxx=icpx.
cc =
cxx =
# Optional colon-separated absolute paths to additional target runtime libraries.
# Use the versioned compiler/runtime directories shared with compute nodes.
runtime_dirs =
# Optional Bash initialization file if "module" is not exported to subprocesses.
module_init =
